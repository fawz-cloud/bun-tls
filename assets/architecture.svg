<text x="878" y="306" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#9A968C">point down</text>
<text x="60" y="556" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#5C5A54">One exception: fp/personas reads each browser's HTTP/2 profile (data) from http/h2.</text>
