<text x="60" y="44" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="700" fill="#E8E6E0">Five layers, one direction</text>

<rect x="60" y="70" width="760" height="72" rx="10" fill="#1B1C20" stroke="#2C2D33"/>
<text x="82" y="101" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="700" fill="#E8E6E0">apps</text>
<text x="804" y="100" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#9A968C" text-anchor="end">MCP server, fingerprint proxy, command line</text>
<text x="82" y="125" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#E8E6E0">mcp, proxy, cli</text>
<rect x="60" y="164" width="760" height="72" rx="10" fill="#1B1C20" stroke="#2C2D33"/>
<text x="82" y="195" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="700" fill="#E8E6E0">http</text>
<text x="804" y="194" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#9A968C" text-anchor="end">request(), Session, fetch(), WebSocket, scrape()</text>
<text x="82" y="219" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#E8E6E0">client, session, pool, http1, h2, h3, fetchlike, ws, scrape, crawl</text>
<rect x="60" y="258" width="372" height="72" rx="10" fill="#1B1C20" stroke="#2C2D33"/>
<text x="82" y="289" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="700" fill="#E8E6E0">fp</text>
<text x="416" y="288" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#9A968C" text-anchor="end">presets, replay, personas</text>
<text x="82" y="313" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#E8E6E0">fingerprints, clients, ja3, capture, personas</text>
<rect x="448" y="258" width="372" height="72" rx="10" fill="#1B1C20" stroke="#2C2D33"/>
<text x="470" y="289" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="700" fill="#E8E6E0">quic</text>
