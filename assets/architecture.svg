<text x="82" y="407" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#E8E6E0">clienthello, handshake, handshake12, record, verify, x509, ocsp</text>
<rect x="60" y="446" width="760" height="72" rx="10" fill="#1B1C20" stroke="#2C2D33"/>
<text x="82" y="477" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="700" fill="#E8E6E0">core</text>
<text x="804" y="476" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#9A968C" text-anchor="end">byte I/O + crypto primitives</text>
<text x="82" y="501" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#E8E6E0">bytes, consts, crypto, cng, chacha, keypool</text>
<line x1="866" y1="90" x2="866" y2="498" stroke="#5C5A54" stroke-width="1.5"/>
<path d="M 861 488 L 866 498 L 871 488" fill="none" stroke="#5C5A54" stroke-width="1.5"/>
