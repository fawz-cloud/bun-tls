<text x="335.52" y="375" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#9A968C">2,388</text>
<text x="60" y="426" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#5C5A54">Bun 1.4.2, curl_cffi 0.15.0, AES-128-GCM. Over the internet, latency is round-trip-bound and the two converge.</text>
