<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img">
<rect width="1000" height="460" rx="14" fill="#141518"/>
<rect x="0.5" y="0.5" width="999" height="459" rx="13.5" fill="none" stroke="#2C2D33"/>

<text x="60" y="44" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="700" fill="#E8E6E0">Throughput — 1000 requests over a reused connection</text>
<text x="60" y="68" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#9A968C">requests per second, localhost (handshake amortized by keep-alive). Higher is better.</text>
<rect x="60" y="86" width="13" height="13" rx="3" fill="#C8A24A"/><text x="80" y="97" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#E8E6E0">bun-tls</text>
<rect x="166" y="86" width="13" height="13" rx="3" fill="#3A3B41"/><text x="186" y="97" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#9A968C">curl_cffi</text>

<text x="212" y="144" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#E8E6E0" text-anchor="end">1 connection</text>
<rect x="230" y="108" width="452.16" height="30" rx="5" fill="#C8A24A"/>
<text x="692.1600000000001" y="129" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#C8A24A">11,304</text>
<rect x="230" y="146" width="60.760000000000005" height="30" rx="5" fill="#3A3B41"/>
<text x="300.76" y="167" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#9A968C">1,519</text>
<text x="212" y="248" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#E8E6E0" text-anchor="end">10 concurrent</text>
<rect x="230" y="212" width="567.72" height="30" rx="5" fill="#C8A24A"/>
<text x="807.72" y="233" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#C8A24A">14,193</text>
<rect x="230" y="250" width="125.72" height="30" rx="5" fill="#3A3B41"/>
<text x="365.72" y="271" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#9A968C">3,143</text>
<text x="212" y="352" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#E8E6E0" text-anchor="end">50 concurrent</text>
<rect x="230" y="316" width="238.44" height="30" rx="5" fill="#C8A24A"/>
<text x="478.44" y="337" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#C8A24A">5,961</text>
