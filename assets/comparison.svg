<text x="60" y="44" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="700" fill="#E8E6E0">How it compares</text>
<text x="60" y="68" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#9A968C">filled = yes, dash = no. utls is a TLS library; HTTP/2 comes from the HTTP layer you pair it with.</text>
