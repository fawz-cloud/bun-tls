<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" width="1000" height="392" role="img">
<rect width="1000" height="392" rx="14" fill="#141518"/>
<rect x="0.5" y="0.5" width="999" height="391" rx="13.5" fill="none" stroke="#2C2D33"/>

<text x="60" y="44" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="700" fill="#E8E6E0">0-RTT saves a round trip (opt-in)</text>

<text x="80" y="74" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="700" fill="#E8E6E0">Full handshake</text>
<text x="80" y="97" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#9A968C">first visit to a host</text>
<line x1="80" y1="128" x2="80" y2="300" stroke="#2C2D33"/>
<line x1="450" y1="128" x2="450" y2="300" stroke="#2C2D33"/>

<text x="265" y="143" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#9A968C" text-anchor="middle">ClientHello</text>
<line x1="80" y1="154" x2="450" y2="154" stroke="#5C5A54" stroke-width="1.5"/>
<path d="M 441 149 L 450 154 L 441 159 Z" fill="#5C5A54"/>
<text x="265" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#9A968C" text-anchor="middle">ServerHello + cert + Finished</text>
<line x1="450" y1="196" x2="80" y2="196" stroke="#5C5A54" stroke-width="1.5"/>
<path d="M 89 191 L 80 196 L 89 201 Z" fill="#5C5A54"/>
<text x="265" y="227" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#9A968C" text-anchor="middle">Finished + request</text>
<line x1="80" y1="238" x2="450" y2="238" stroke="#5C5A54" stroke-width="1.5"/>
<path d="M 441 233 L 450 238 L 441 243 Z" fill="#5C5A54"/>
<text x="265" y="269" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#9A968C" text-anchor="middle">response</text>
<line x1="450" y1="280" x2="80" y2="280" stroke="#5C5A54" stroke-width="1.5"/>
<path d="M 89 275 L 80 280 L 89 285 Z" fill="#5C5A54"/>
<text x="80" y="320" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#9A968C">client</text>
<text x="450" y="320" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#9A968C" text-anchor="end">server</text>
<rect x="80" y="330" width="370" height="28" rx="7" fill="none" stroke="#9A968C"/>
<text x="265" y="348" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#9A968C" text-anchor="middle">2 round trips before data</text>

<text x="550" y="74" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="700" fill="#E8E6E0">0-RTT resumption</text>
<text x="550" y="97" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#9A968C">returning, with a cached ticket</text>
<line x1="550" y1="128" x2="550" y2="300" stroke="#2C2D33"/>
<line x1="920" y1="128" x2="920" y2="300" stroke="#2C2D33"/>

<text x="735" y="143" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#9A968C" text-anchor="middle">ClientHello + request</text>
<line x1="550" y1="154" x2="920" y2="154" stroke="#5C5A54" stroke-width="1.5"/>
<path d="M 911 149 L 920 154 L 911 159 Z" fill="#5C5A54"/>
<text x="735" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#9A968C" text-anchor="middle">response</text>
<line x1="920" y1="196" x2="550" y2="196" stroke="#5C5A54" stroke-width="1.5"/>
<path d="M 559 191 L 550 196 L 559 201 Z" fill="#5C5A54"/>
<text x="550" y="320" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#9A968C">client</text>
<text x="920" y="320" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#9A968C" text-anchor="end">server</text>
<rect x="550" y="330" width="370" height="28" rx="7" fill="none" stroke="#C8A24A"/>
<text x="735" y="348" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#C8A24A" text-anchor="middle">1 round trip — request rides along</text>
</svg>